<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Breaker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Ice Breaker</h1>

        <p id="game-status">Ready to start!</p>

        <div class="game-info">
            <p>Time: <span id="timer">30</span></p>
            <p>Score: <span id="score">0</span></p>
        </div>

        <button id="start-button">Start Game</button>
        <button id="score-button" disabled>Score Point</button>
        <button id="end-button" disabled>End Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
